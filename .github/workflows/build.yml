name: Build Windows

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
        env:
          # Número da versão, usado pela atualização automática.
          ISLANDBAR_BUILD: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: islandbar-windows
          path: target/release/islandbar.exe
      # Publica a versão: é daqui que as ilhas instaladas se atualizam.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ github.run_number }}" > version.txt
          gh release create "build-${{ github.run_number }}" \
            target/release/islandbar.exe version.txt \
            --title "Versão ${{ github.run_number }}" \
            --notes "Compilada automaticamente a partir de ${{ github.sha }}." \
            --latest
      # Abre a ilha no Windows da máquina de build e guarda screenshots,
      # para conferir a aparência real sem depender de um PC.
      - name: Compila o jogo falso do teste
        continue-on-error: true
        run: cargo build --release --example fake_game
      - name: Teste visual
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/
          if-no-files-found: ignore
      # Também guarda as imagens na branch "ci-results" (sempre sobrescrita).
      - name: Publica screenshots
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd smoke
          git init -q -b ci-results
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Teste visual de ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" ci-results
